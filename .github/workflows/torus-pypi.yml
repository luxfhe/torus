name: torus-pypi

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build sdist + wheel, publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distributions
        # Tag-driven: tagging v0.1.0 etc. on main triggers this job. The
        # native compiler bindings are NOT built here yet; this job ships the
        # pure-Python sdist + a placeholder wheel. The full cross-platform
        # wheel matrix lands in a follow-up workflow (see PUBLISHING.md).
        working-directory: frontends/torus-python
        run: python -m build --sdist --wheel --outdir ../../dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
