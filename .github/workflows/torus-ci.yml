name: torus-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: torus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install flake8
        run: python -m pip install --upgrade pip flake8
      - name: Lint torus package
        # Fail only on real errors (E*); leave style nits to a later pass.
        run: flake8 --select=E --show-source --statistics frontends/torus-python/torus/

  test-cpu:
    name: Test (CPU backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        working-directory: frontends/torus-python
        run: |
          python -m pip install --upgrade pip
          # Prefer pyproject.toml; fall back to requirements.txt for the
          # actively-used runtime deps until the setup.py shim is retired.
          if [ -f pyproject.toml ]; then
            python -m pip install -e .[dev] || python -m pip install -r requirements.txt -r requirements.dev.txt
          else
            python -m pip install -r requirements.txt -r requirements.dev.txt
          fi
          python -m pip install pytest
      - name: Run pytest (CPU)
        working-directory: frontends/torus-python
        env:
          TORUS_BACKEND: cpu
        run: pytest tests/ -x -q --maxfail=5

  build-compiler:
    name: Build compiler (CPU-only)
    runs-on: [self-hosted, lux-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Configure (CMake, CPU-only)
        # LUX_GPU=OFF is the project-wide GPU gate; TORUSLANG_CUDA_SUPPORT=OFF
        # is the underlying CMake option that actually disables the CUDA path
        # in compilers/torus-compiler/compiler/CMakeLists.txt. Both are set
        # to make intent explicit and resilient to either renaming.
        run: |
          cmake -S compilers/torus-compiler/compiler \
                -B build/compiler \
                -DCMAKE_BUILD_TYPE=Release \
                -DLUX_GPU=OFF \
                -DTORUSLANG_CUDA_SUPPORT=OFF
      - name: Build
        run: cmake --build build/compiler -j
