name: torus-rust tests macos
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/concrete_rust_test_macos.yml
      - frontends/torus-rust/**
  push:
    branches:
      - 'main'
      - 'release/*'

concurrency:
  group: concrete_rust_tests_macos_${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ACTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
  SLACK_USERNAME: ${{ secrets.BOT_USERNAME }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  torus-rust-test:
    strategy:
      fail-fast: false
      matrix:
        machine: ["aws-mac1-metal", "aws-mac2-metal"]
    runs-on: ${{ matrix.machine }}
    outputs:
      slack_message: ${{ steps.prepare_slack_notif.outputs.slack_message }}
      slack_color: ${{ steps.prepare_slack_notif.outputs.slack_color }}
    env:
      torus-compiler-dir: ${{ github.workspace }}/compilers/torus-compiler/compiler
      torus-rust-dir: ${{ github.workspace }}/frontends/torus-rust
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: 'false'
      - name: Install build dependencies
        run: |
          brew install ninja ccache
      - name: Setup rust toolchain for torus-cpu
        uses: ./.github/actions/setup_rust_toolchain_for_concrete_cpu
      - name: Install rust
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: 1.84.0
          override: true
      - name: Build rust bindings
        run: |
          set -e
          cd ${{ env.torus-compiler-dir }}
          rm -rf .venv
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r lib/Bindings/Python/requirements_dev.txt
          cargo install cxxbridge-cmd
          ccache -z
          make Python3_EXECUTABLE="$(which python)" torus-rust
          ccache -s
      - name: Run tests
        run: |
          set -e
          cd ${{ env.torus-rust-dir }}
          make clean
          make clear_locks
          make test
      - name: Prepare Slack Notification
        id: prepare_slack_notif
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          echo "slack_message=torus-rust-test (${{matrix.machine}}) finished with status: ${{ job.status }}. (${{ env.ACTION_RUN_URL }})" >> "$GITHUB_OUTPUT"
          echo "slack_color=${{ job.status }}" >> "$GITHUB_OUTPUT"

  slack-notif-macos:
    needs: ["torus-rust-test"]
    runs-on: "ubuntu-latest"
    if: always()
    steps:
      - name: Slack Notification
        # we want to check that prepare_slack_notif was run
        if: ${{ needs.torus-rust-test.outputs.slack_color != '' }}
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661
        env:
          SLACK_COLOR: ${{ needs.torus-rust-test.outputs.slack_color }}
          SLACK_MESSAGE: ${{ needs.torus-rust-test.outputs.slack_message }}
