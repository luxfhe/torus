[package]
name = "torus"
version = "0.0.0"
edition = "2021"
links = "torus"
readme = "../../../../../../../README.md"
keywords = ["fully", "homomorphic", "encryption", "fhe", "cryptography"]
homepage = "https://luxfhe.com/"
documentation = "https://docs.luxfhe.com/torus"
repository = "https://github.com/luxfhe/torus"
license = "BSD-3-Clause-Clear"
description = "Torus is an open-source FHE Compiler that simplifies the use of fully homomorphic encryption (FHE)."
build = "build.rs"

[dependencies]
cxx = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quote  = {version = "1.0", optional =true }
proc-macro2 = {version = "1.0", optional = true}
libc = "0.2"
tfhe = {version = "1.1", features = ["integer"], optional = true}

[build-dependencies]
zip = "2.4"
curl = "0.4.47"
cxx-build = "1.0"
libc = "0.2"

[dev-dependencies]
ar = "0.9"

[features]
default = ["Lux-FHE", "compiler"]
compiler = ["dep:quote", "dep:proc-macro2"]
Lux-FHE = ["dep:tfhe"]
